[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "autoposter"
version = "0.1.0"
description = "Facebook group auto-posting bot for car-sale inventory (Playwright web automation)"
authors = ["Alexei <alexei@localhost>"]
readme = "AGENTS.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
playwright = ">=1.48,<2"

[tool.poetry.group.dev.dependencies]
pytest = ">=8"
ruff = ">=0.5"

[tool.pytest.ini_options]
testpaths = ["tests"]
# scraping_recorder on the path so `pytest tests scraping_recorder/tests`
# works from the repo root (its tests import sibling modules by bare name)
pythonpath = [".", "scraping_recorder"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
"poster/fb.py" = ["BLE001", "S110"]  # browser nav/teardown: broad catches are intentional
"poster/flows.py" = ["BLE001", "S110"]  # composer cleanup is best-effort by design
"scripts/probe_picker_scroll.py" = ["BLE001", "S110"]  # diagnostic probe: broad catches on purpose
"poster/main.py" = ["BLE001", "S110", "SIM115", "SIM105"]  # run log stays open for whole process; per-group isolation; composer Escape cleanup is best-effort
