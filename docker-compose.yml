name: autoposter

services:
  # The dashboard (default) — and the workhorse for one-off commands:
  #   docker compose up -d                                   # dashboard on :8765
  #   docker compose run --rm autoposter python -m poster.main --dry-run
  #   docker compose run --rm autoposter python -m poster.crosspost --list
  autoposter:
    build: .
    image: autoposter
    container_name: autoposter
    restart: unless-stopped
    # Run as the HOST user, not root: everything this container writes
    # (uploads, saved post.txt, ledger lines, the Firefox profile) lands on
    # bind mounts — as root those files become untouchable from the host
    # shell AND the native poetry route (root-owned prefs.js breaks native
    # firefox saves). Override on machines with a different uid:
    #   AP_UID=1001 AP_GID=1001 ap-gui
    user: "${AP_UID:-1000}:${AP_GID:-1000}"
    environment:
      DISPLAY: ${DISPLAY:-:0}   # WSLg: headed Firefox windows appear on
      HOME: /tmp                # the Windows desktop, like native runs
    volumes:
      - .:/app                       # code + data/ + .env + .local-capture
      - /tmp/.X11-unix:/tmp/.X11-unix  # X11 socket (headed browser)
      - /mnt/wslg:/mnt/wslg:ro         # WSLg runtime + fonts
    ports:
      # HOST side pinned to loopback: the container binds 0.0.0.0 (required
      # for published ports to reach it at all) but the unauthenticated
      # dashboard still never appears on your LAN — same security property
      # as the native run.
      - "127.0.0.1:8765:8765"
    command: python -m poster.gui --port 8765 --bind-container

  # One-time ritual: FIRST login inside a container (or any time cookies
  # expire). Opens headed Firefox on the Facebook login page; sign in by
  # hand (2FA included — we never touch the credentials), then press
  # q + Enter in this terminal to save and quit. The profile is the
  # bind-mounted .local-capture/profiles/facebook, so every later
  # `docker compose run`/`up` reuses the session.
  autoposter-login:
    profiles: ["login"]
    image: autoposter
    user: "${AP_UID:-1000}:${AP_GID:-1000}"
    environment:
      DISPLAY: ${DISPLAY:-:0}
      HOME: /tmp
    volumes:
      - .:/app
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /mnt/wslg:/mnt/wslg:ro
    command: python scraping_recorder/record_session.py
      --url https://www.facebook.com
      --profile .local-capture/profiles/facebook
      --out .local-capture/manual_session
